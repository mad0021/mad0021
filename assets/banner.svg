<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#cdc4ba" fill-opacity="0.06"/>
      <circle cx="3" cy="3" r="0.5" fill="#cdc4ba" fill-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" fill="#000000"/>
  <rect width="1200" height="340" fill="url(#grain)"/>
  <!-- halo -->
  <circle cx="980" cy="120" r="220" fill="none" stroke="#cdc4ba" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="980" cy="120" r="160" fill="none" stroke="#cdc4ba" stroke-opacity="0.12" stroke-width="1"/>
  <!-- left rules -->
  <line x1="48" y1="48" x2="48" y2="292" stroke="#cdc4ba" stroke-opacity="0.26" stroke-width="1"/>
  <text x="36" y="170" fill="#958f87" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="4" transform="rotate(-90 36 170)">SYSTEM DOSSIER</text>
  <!-- eyebrow -->
  <text x="80" y="78" fill="#7a756e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3">— 作 · MADEV · PUBLIC</text>
  <!-- name -->
  <text x="80" y="155" fill="#cdc4ba" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="400">MAMADOU</text>
  <text x="80" y="200" fill="#b0a9a0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Full-stack · Power Platform · Girona</text>
  <!-- specs row -->
  <line x1="80" y1="230" x2="720" y2="230" stroke="#cdc4ba" stroke-opacity="0.18" stroke-width="1"/>
  <text x="80" y="258" fill="#958f87" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">ROLE</text>
  <text x="160" y="258" fill="#cdc4ba" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Software Developer</text>
  <text x="380" y="258" fill="#958f87" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">HANDLE</text>
  <text x="470" y="258" fill="#cdc4ba" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">@mad0021</text>
  <!-- chips -->
  <rect x="80" y="278" width="108" height="28" fill="none" stroke="#cdc4ba" stroke-opacity="0.42" stroke-width="1"/>
  <text x="134" y="296" text-anchor="middle" fill="#cdc4ba" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1">POWER APPS</text>
  <rect x="198" y="278" width="128" height="28" fill="none" stroke="#cdc4ba" stroke-opacity="0.42" stroke-width="1"/>
  <text x="262" y="296" text-anchor="middle" fill="#cdc4ba" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1">AUTOMATE</text>
  <rect x="336" y="278" width="88" height="28" fill="none" stroke="#cdc4ba" stroke-opacity="0.42" stroke-width="1"/>
  <text x="380" y="296" text-anchor="middle" fill="#cdc4ba" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1">BI</text>
  <rect x="434" y="278" width="118" height="28" fill="#cdc4ba"/>
  <text x="493" y="296" text-anchor="middle" fill="#000000" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1">DATA</text>
  <!-- mark -->
  <text x="1080" y="300" fill="#cdc4ba" fill-opacity="0.08" font-family="Georgia, 'Times New Roman', serif" font-size="140">作</text>
</svg>
